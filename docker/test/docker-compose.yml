# 单校部署示例：PostgreSQL（存测速记录） + LibreSpeed 前端（本镜像）。
#
# 使用步骤：
#   1. 修改下方所有 ChangeMe_* 占位密码（两处 DB 密码必须一致）；
#   2. 定制站点信息：把 docker/default-site/ 复制到自定义目录（如 docker/site/），
#      参照 docker/site-config.example.json 填写 site-config.json 并放入校徽文件；
#      （未放置任何配置文件时会使用镜像内置的空白通用模板）
#   3. 启动：docker compose -p speedtest up -d --build
#      重启使配置生效：docker compose -p speedtest restart speedtest-debian-pg
#
# 注意：pg_data 数据卷首次初始化后，再修改 POSTGRES_PASSWORD 不会改变已存在数据库的密码。

x-shared:
  speedtest-env: &speedtest-env
    # 统计页 Login 密码（仅 ENABLE_STATS=true 时使用）。学校名称、页脚、校徽不在此处，只放挂载目录
    PASSWORD: "ChangeMe_Stats_123!"
    TELEMETRY: "true"
    # 需要在线查看测速记录时改为 "true"（访问 /results/stats.php，登录密码为上面的 PASSWORD）
    ENABLE_STATS: "false"

services:
  pg:
    image: postgres:alpine
    environment:
      POSTGRES_PASSWORD: "ChangeMe_DB_123!"
      POSTGRES_USER: "librespeed"
      TZ: "Asia/Shanghai"
      PGTZ: "Asia/Shanghai"
    volumes:
      - ../../results/telemetry_postgresql.sql:/docker-entrypoint-initdb.d/01-init.sql
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  speedtest-debian-pg:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      <<: *speedtest-env
      DB_HOSTNAME: "pg"
      DB_NAME: "librespeed"
      # 必须与上方 pg 服务的 POSTGRES_PASSWORD 保持一致
      DB_PASSWORD: "ChangeMe_DB_123!"
      DB_TYPE: "postgresql"
      DB_USERNAME: "librespeed"
      TZ: "Asia/Shanghai"
    ports:
      - 9123:8080
    volumes:
      # 学校定制目录（只读挂载）。镜像内没有校名和校徽；换学校时替换这个目录后重启容器
      - ../../docker/site:/speedtest-site:ro
    depends_on:
      - pg
    restart: unless-stopped

volumes:
  pg_data:
