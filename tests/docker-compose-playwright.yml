services:
  backend-testpoint:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      - MODE=backend
      - WEBPORT=8080

  standalone:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      - MODE=standalone
      - WEBPORT=8080
      - USE_NEW_DESIGN=false
      # 规则乙：TITLE 已废弃，设置它不应影响页面标题（标题只来自 site-config.json）
      - 'TITLE=Grüße "Tempo" ''Österreich'''
    ports:
      - "18180:8080"

  standalone-new:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      - MODE=standalone
      - WEBPORT=8080
      - USE_NEW_DESIGN=true
      - 'TITLE=Grüße "Tempo" ''Österreich'''
    volumes:
      # 挂载自定义 site-config.json，验证挂载后标题唯一来源为该文件
      - ./e2e/fixtures/custom-site:/speedtest-site:ro
    ports:
      - "18185:8080"

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      - MODE=backend
      - WEBPORT=8080
    ports:
      - "18181:8080"

  frontend:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      - backend-testpoint
    environment:
      - MODE=frontend
      - WEBPORT=8080
    volumes:
      - ./e2e/fixtures/servers-frontend.json:/servers.json:ro
    ports:
      - "18182:8080"

  dual:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      - backend-testpoint
    environment:
      - MODE=dual
      - WEBPORT=8080
    volumes:
      - ./e2e/fixtures/servers-dual.json:/servers.json:ro
    ports:
      - "18183:8080"
